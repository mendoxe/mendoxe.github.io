name: Build and deploy Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'
      - run: dart pub get --enforce-lockfile
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: dart run tool/site.dart check
      - name: Build and verify static output
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: dart run tool/ci_build.dart
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/jaspr
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
